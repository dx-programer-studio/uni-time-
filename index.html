<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uni-time - منظم الوقت اليومي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius: 20px;
        }

        .dark-mode {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Canvas Background for Connected Dots */
        #dotCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title .studio-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
        }

        .icon-btn:hover {
            background: var(--border);
            transform: scale(1.05);
        }

        /* Main Content Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 0;
        }

        @media (max-width: 850px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .content-section {
            padding: 25px;
            border-left: 1px solid var(--border);
        }

        @media (max-width: 850px) {
            .content-section {
                border-left: none;
                border-bottom: 1px solid var(--border);
            }
        }

        /* Progress Bar */
        .progress-box {
            background: rgba(99, 102, 241, 0.05);
            padding: 15px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Task Input */
        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .task-input-group input {
            flex: 1;
            min-width: 150px;
        }

        .task-input-group input, .task-input-group select {
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .task-input-group select {
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 45px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Tasks List */
        .tasks-container {
            max-height: 320px;
            overflow-y: auto;
            padding-left: 4px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            word-break: break-word;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .badge-high { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .badge-medium { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .badge-low { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            color: var(--danger);
            transform: scale(1.1);
        }

        /* Sidebar / Pomodoro & Notes */
        .sidebar {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(0, 0, 0, 0.01);
        }

        .pomodoro-card {
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 14px;
        }

        .pomodoro-time {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 8px 0;
        }

        .pomodoro-btns {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
        }

        .btn-sm:hover {
            border-color: var(--primary);
        }

        .btn-sm.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Quick Notes */
        .notes-card {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .notes-card h3 {
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .notes-card textarea {
            width: 100%;
            flex: 1;
            min-height: 100px;
            resize: none;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 25px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <canvas id="dotCanvas"></canvas>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <div>
                    <h1>uni-time ⏱️</h1>
                    <div class="studio-name">dx-programer-studio</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" title="تبديل الوضع الليلي">🌙</button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="main-grid">
            <!-- Tasks Section -->
            <div class="content-section">
                <div class="progress-box">
                    <div class="progress-info">
                        <span>إنجاز اليوم</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBar"></div>
                    </div>
                </div>

                <div class="task-input-group">
                    <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
                    <select id="taskPriority">
                        <option value="high">عالية</option>
                        <option value="medium" selected>متوسطة</option>
                        <option value="low">منخفضة</option>
                    </select>
                    <button class="btn-primary" id="addTaskBtn">إضافة</button>
                </div>

                <div class="tasks-container" id="tasksList">
                    <!-- Tasks injected here -->
                </div>
            </div>

            <!-- Sidebar Section -->
            <div class="sidebar">
                <!-- Pomodoro Timer -->
                <div class="pomodoro-card">
                    <h3 id="timerLabel" style="font-size: 0.95rem;">وقت العمل 🍅</h3>
                    <div class="pomodoro-time" id="timerDisplay">25:00</div>
                    <div class="pomodoro-btns" style="margin-bottom: 10px;">
                        <button class="btn-sm active" onclick="setTimer(25, 'وقت العمل 🍅', this)">عمل (25د)</button>
                        <button class="btn-sm" onclick="setTimer(5, 'استراحة قصيرة ☕', this)">استراحة (5د)</button>
                    </div>
                    <div class="pomodoro-btns">
                        <button class="btn-sm" id="startTimerBtn" onclick="toggleTimer()">تشغيل</button>
                        <button class="btn-sm" onclick="resetTimer()">إعادة ضبط</button>
                    </div>
                </div>

                <!-- Quick Notes -->
                <div class="notes-card">
                    <h3>ملاحظات سريعة 📝</h3>
                    <textarea id="quickNotes" placeholder="اكتب ملاحظاتك هنا، تُحفظ تلقائياً..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Animated Connected Dots Background ---
        const canvas = document.getElementById('dotCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('dark-mode') ? 'rgba(129, 140, 248, 0.5)' : 'rgba(99, 102, 241, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let count = Math.floor((canvas.width * canvas.height) / 15000);
            for (let i = 0; i < count; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();

                for (let j = i; j < particlesArray.length; j++) {
                    let dx = particlesArray[i].x - particlesArray[j].x;
                    let dy = particlesArray[i].y - particlesArray[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.strokeStyle = document.body.classList.contains('dark-mode') 
                            ? `rgba(129, 140, 248, ${1 - distance / 100})` 
                            : `rgba(99, 102, 241, ${0.8 - distance / 100})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- App Logic ---
        let tasks = JSON.parse(localStorage.getItem('unitime_tasks')) || [];
        let quickNotesText = localStorage.getItem('unitime_notes') || '';

        const taskInput = document.getElementById('taskInput');
        const taskPriority = document.getElementById('taskPriority');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const tasksList = document.getElementById('tasksList');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const quickNotes = document.getElementById('quickNotes');
        const themeToggle = document.getElementById('themeToggle');

        if (localStorage.getItem('unitime_theme') === 'dark' || !localStorage.getItem('unitime_theme')) {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        } else {
            document.body.classList.remove('dark-mode');
            themeToggle.textContent = '🌙';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('unitime_theme', isDark ? 'dark' : 'light');
        });

        function renderTasks() {
            tasksList.innerHTML = '';
            if (tasks.length === 0) {
                tasksList.innerHTML = `<div class="empty-state">لا توجد مهام حالياً. ابدأ بإضافة مهامك اليومية ✨</div>`;
                updateProgress();
                return;
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('div');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                let badgeClass = 'badge-medium';
                let badgeText = 'متوسطة';
                if(task.priority === 'high') { badgeClass = 'badge-high'; badgeText = 'عالية'; }
                if(task.priority === 'low') { badgeClass = 'badge-low'; badgeText = 'منخفضة'; }

                li.innerHTML = `
                    <div class="task-info">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                        <span>${escapeHtml(task.text)}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <button class="delete-btn" onclick="deleteTask(${index})">🗑️</button>
                    </div>
                `;
                tasksList.appendChild(li);
            });
            updateProgress();
            saveTasks();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;
            tasks.push({
                text: text,
                priority: taskPriority.value,
                completed: false
            });
            taskInput.value = '';
            renderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function updateProgress() {
            if (tasks.length === 0) {
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                return;
            }
            const completedCount = tasks.filter(t => t.completed).length;
            const percentage = Math.round((completedCount / tasks.length) * 100);
            progressBar.style.width = percentage + '%';
            progressText.textContent = percentage + '%';
        }

        function saveTasks() {
            localStorage.setItem('unitime_tasks', JSON.stringify(tasks));
        }

        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        quickNotes.value = quickNotesText;
        quickNotes.addEventListener('input', () => {
            localStorage.setItem('unitime_notes', quickNotes.value);
        });

        let timerMinutes = 25;
        let timerSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const startTimerBtn = document.getElementById('startTimerBtn');
        const timerLabel = document.getElementById('timerLabel');

        function updateTimerDisplay() {
            const m = String(timerMinutes).padStart(2, '0');
            const s = String(timerSeconds).padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startTimerBtn.textContent = 'تشغيل';
                isRunning = false;
            } else {
                isRunning = true;
                startTimerBtn.textContent = 'إيقاف مؤقت';
                timerInterval = setInterval(() => {
                    if (timerSeconds === 0) {
                        if (timerMinutes === 0) {
                            clearInterval(timerInterval);
                            alert('انتهى الوقت! خذ استراحة أو عد للعمل ⏰');
                            isRunning = false;
                            startTimerBtn.textContent = 'تشغيل';
                            return;
                        }
                        timerMinutes--;
                        timerSeconds = 59;
                    } else {
                        timerSeconds--;
                    }
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function setTimer(mins, labelText, btnElement) {
            clearInterval(timerInterval);
            isRunning = false;
            startTimerBtn.textContent = 'تشغيل';
            timerMinutes = mins;
            timerSeconds = 0;
            timerLabel.textContent = labelText;
            updateTimerDisplay();

            document.querySelectorAll('.pomodoro-card .btn-sm').forEach(b => {
                if(b.onclick && b.onclick.toString().includes('setTimer')) {
                    b.classList.remove('active');
                }
            });
            if(btnElement) btnElement.classList.add('active');
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startTimerBtn.textContent = 'تشغيل';
            timerMinutes = 25;
            timerSeconds = 0;
            timerLabel.textContent = 'وقت العمل 🍅';
            updateTimerDisplay();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        renderTasks();
        updateTimerDisplay();
    </script>
</body>
</html>
